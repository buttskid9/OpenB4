name: Build Raven
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        working-directory: OpenB4
        run: gradle build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        with:
          name: RavenB4-jar
          path: OpenB4/build/libs/RavenB4.jar
